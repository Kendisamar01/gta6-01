<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay — open-world crime sandbox</title>
<style>
  html, body { background: #101d26; height: 100%; margin: 0; overflow: hidden; }
  #game { display: block; height: 100%; inset: 0; position: fixed; touch-action: none; width: 100%; }
  #status {
    clip: rect(0 0 0 0); height: 1px; overflow: hidden; position: fixed;
    white-space: nowrap; width: 1px;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay. Move with WASD, aim with the mouse, use E to enter cars and start missions, and press Enter to choose menu items."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
