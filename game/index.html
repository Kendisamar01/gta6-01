<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solara Bay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101d26; }
  #game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #status { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solara Bay, a top-down city crime game. WASD moves, the mouse aims, E enters cars, and Enter selects menu items."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
